name: POS Build Validation

on:
  push:
    branches:
      - agent/pos-foundation-fixes
  pull_request:
    branches:
      - master
  workflow_dispatch:

jobs:
  build-and-database:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Restore packages
        shell: pwsh
        run: nuget restore packages.config -PackagesDirectory packages

      - name: Validate LAN installer PowerShell syntax
        shell: pwsh
        run: |
          foreach ($file in @('installer\setup_pos_lan.ps1','installer\create_pos_icon.ps1')) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $file),
              [ref]$tokens,
              [ref]$errors
            )
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error ("$file : " + $_.Message) }
              exit 1
            }
          }

      - name: Build Pos_System
        shell: pwsh
        run: msbuild Pos_System.csproj /m /p:Configuration=Debug /p:Platform=AnyCPU /verbosity:minimal

      - name: Validate branded shortcut icon generation
        shell: pwsh
        run: |
          $testApp = 'C:\BikeZonePOS\App'
          New-Item -ItemType Directory -Force -Path $testApp | Out-Null
          Copy-Item 'bin\Debug\Pos_System.exe' (Join-Path $testApp 'Pos_System.exe') -Force
          & '.\installer\create_pos_icon.ps1'
          $icon = Join-Path $testApp 'BikeZonePOS.ico'
          if (-not (Test-Path $icon)) { throw 'BikeZonePOS.ico was not generated.' }
          if ((Get-Item $icon).Length -le 0) { throw 'BikeZonePOS.ico is empty.' }
          Write-Host "Generated icon bytes: $((Get-Item $icon).Length)"

      - name: Start SQL Server LocalDB
        shell: pwsh
        run: |
          sqllocaldb start MSSQLLocalDB
          sqllocaldb info MSSQLLocalDB

      - name: Validate SQL-only fresh install and all migrations
        shell: pwsh
        run: |
          function New-Connection([string]$Database = 'master') {
            $cs = "Data Source=(localdb)\MSSQLLocalDB;Initial Catalog=$Database;Integrated Security=True;TrustServerCertificate=True"
            $connection = New-Object System.Data.SqlClient.SqlConnection $cs
            $connection.Open()
            return $connection
          }

          function Invoke-Sql([string]$Query, [string]$Database = 'master') {
            $connection = New-Connection $Database
            try {
              $command = $connection.CreateCommand()
              $command.CommandTimeout = 120
              $command.CommandText = $Query
              [void]$command.ExecuteNonQuery()
            }
            finally { $connection.Dispose() }
          }

          function Invoke-SqlFile([string]$Path, [string]$Database) {
            $text = Get-Content -Raw $Path
            $batches = [regex]::Split($text, '(?im)^\s*GO\s*(?:--.*)?$')
            $connection = New-Connection $Database
            try {
              foreach ($batch in $batches) {
                if ([string]::IsNullOrWhiteSpace($batch)) { continue }
                $command = $connection.CreateCommand()
                $command.CommandTimeout = 120
                $command.CommandText = $batch
                [void]$command.ExecuteNonQuery()
              }
            }
            finally { $connection.Dispose() }
          }

          Invoke-Sql "IF DB_ID(N'pos_system_ci') IS NOT NULL BEGIN ALTER DATABASE pos_system_ci SET SINGLE_USER WITH ROLLBACK IMMEDIATE; DROP DATABASE pos_system_ci; END; CREATE DATABASE pos_system_ci;" 'master'
          Invoke-SqlFile 'database/install/000_base_schema.sql' 'pos_system_ci'

          $migrations = Get-ChildItem 'database\migrations' -Filter '*.sql' -File | Sort-Object Name
          if (-not $migrations) { throw 'No database migrations were found.' }
          foreach ($migration in $migrations) {
            Write-Host "Applying $($migration.Name)"
            Invoke-SqlFile $migration.FullName 'pos_system_ci'
          }

      - name: Verify upgraded schema
        shell: pwsh
        run: |
          $connectionString = 'Data Source=(localdb)\MSSQLLocalDB;Initial Catalog=pos_system_ci;Integrated Security=True;TrustServerCertificate=True'
          $connection = New-Object System.Data.SqlClient.SqlConnection $connectionString
          $connection.Open()
          try {
            $command = $connection.CreateCommand()
            $command.CommandText = @"
          IF OBJECT_ID(N'dbo.Users', N'U') IS NULL THROW 52000, 'Users table missing.', 1;
          IF OBJECT_ID(N'dbo.Settings', N'U') IS NULL THROW 52001, 'Settings table missing.', 1;
          IF COL_LENGTH('dbo.Settings', 'key_name') IS NULL THROW 52002, 'Settings.key_name missing.', 1;
          IF COL_LENGTH('dbo.Products', 'price_usd') IS NULL THROW 52003, 'Products.price_usd missing.', 1;
          IF COL_LENGTH('dbo.Products', 'sale_price_usd') IS NULL THROW 52004, 'Products.sale_price_usd missing.', 1;
          IF OBJECT_ID(N'dbo.Sale_Items', N'U') IS NULL THROW 52005, 'Legacy Sale_Items table missing.', 1;
          IF COL_LENGTH('dbo.Sales', 'customer_name') IS NULL THROW 52006, 'Sales.customer_name missing.', 1;
          IF COL_LENGTH('dbo.Customers', 'balance_usd') IS NULL THROW 52007, 'Customers.balance_usd missing.', 1;
          IF OBJECT_ID(N'dbo.Purchases', N'U') IS NULL THROW 52008, 'Purchases table missing.', 1;
          IF OBJECT_ID(N'dbo.PurchaseItems', N'U') IS NULL THROW 52009, 'PurchaseItems table missing.', 1;
          IF OBJECT_ID(N'dbo.InventoryTransactions', N'U') IS NULL THROW 52010, 'InventoryTransactions table missing.', 1;
          IF OBJECT_ID(N'dbo.SupplierTransactions', N'U') IS NULL THROW 52011, 'SupplierTransactions table missing.', 1;
          IF OBJECT_ID(N'dbo.SupplierPayments', N'U') IS NULL THROW 52012, 'SupplierPayments table missing.', 1;
          IF OBJECT_ID(N'dbo.CustomerTransactions', N'U') IS NULL THROW 52013, 'CustomerTransactions table missing.', 1;
          IF OBJECT_ID(N'dbo.CustomerPayments', N'U') IS NULL THROW 52014, 'CustomerPayments table missing.', 1;
          IF OBJECT_ID(N'dbo.TR_Sales_CustomerLedger', N'TR') IS NULL THROW 52015, 'Customer ledger sale trigger missing.', 1;
          IF COL_LENGTH('dbo.Products', 'purchase_price') IS NULL THROW 52016, 'Products.purchase_price missing.', 1;
          IF COL_LENGTH('dbo.Products', 'selling_price') IS NULL THROW 52017, 'Products.selling_price missing.', 1;
          IF COL_LENGTH('dbo.Sales', 'invoice_number') IS NULL THROW 52018, 'Sales.invoice_number missing.', 1;
          IF OBJECT_ID(N'dbo.WhishPaymentAttempts', N'U') IS NULL THROW 52019, 'WhishPaymentAttempts table missing.', 1;
          IF COL_LENGTH('dbo.SalePayments', 'payer_phone') IS NULL THROW 52020, 'SalePayments.payer_phone missing.', 1;
          IF COL_LENGTH('dbo.SalePayments', 'provider_status') IS NULL THROW 52021, 'SalePayments.provider_status missing.', 1;
          "@
            [void]$command.ExecuteNonQuery()

            $command.CommandText = 'SELECT COUNT(*) FROM dbo.SchemaMigrations;'
            $appliedCount = [int]$command.ExecuteScalar()
            $fileCount = (Get-ChildItem 'database\migrations' -Filter '*.sql' -File).Count
            if ($appliedCount -lt $fileCount) {
              throw "SchemaMigrations recorded $appliedCount migrations but repository contains $fileCount migration files."
            }
          }
          finally { $connection.Dispose() }

      - name: Build installer package
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: |
          $package = Join-Path $PWD 'dist\BikeZonePOS-Installer'
          New-Item -ItemType Directory -Force -Path $package | Out-Null
          New-Item -ItemType Directory -Force -Path (Join-Path $package 'App') | Out-Null
          New-Item -ItemType Directory -Force -Path (Join-Path $package 'Database') | Out-Null
          New-Item -ItemType Directory -Force -Path (Join-Path $package 'Migrations') | Out-Null

          Copy-Item 'bin\Debug\*' (Join-Path $package 'App') -Recurse -Force
          Copy-Item 'database\install\000_base_schema.sql' (Join-Path $package 'Database\000_base_schema.sql') -Force
          Copy-Item 'database\migrations\*.sql' (Join-Path $package 'Migrations') -Force
          Copy-Item 'installer\install_pos_system.bat' $package -Force
          Copy-Item 'installer\setup_pos_lan.ps1' $package -Force
          Copy-Item 'installer\create_pos_icon.ps1' $package -Force
          Copy-Item 'installer\Installer.config.json' $package -Force
          Copy-Item 'installer\README.txt' $package -Force
          Copy-Item 'installer\INSTALL_STEPS.txt' $package -Force
          Copy-Item 'installer\تعليمات_التثبيت_بالعربي.txt' $package -Force
          if (Test-Path 'installer\SQL2022-SSEI-Expr.exe') {
            Copy-Item 'installer\SQL2022-SSEI-Expr.exe' $package -Force
          }

          $migrationNames = (Get-ChildItem 'database\migrations' -Filter '*.sql' -File | Sort-Object Name | Select-Object -ExpandProperty Name) -join ','
          @"
          BuildCommit=$env:GITHUB_SHA
          BuildDateUtc=$([DateTime]::UtcNow.ToString('yyyy-MM-ddTHH:mm:ssZ'))
          InstallModel=SQL_ONLY_LAN_SERVER_CLIENT
          DatabaseBaseSchema=000_base_schema.sql
          DatabaseMigrations=$migrationNames
          BrandingIcon=BikeZonePOS.ico generated during install
          "@ | Set-Content (Join-Path $package 'VERSION.txt') -Encoding UTF8

      - name: Upload installer package
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: BikeZonePOS-Installer
          path: dist/BikeZonePOS-Installer
          if-no-files-found: error
          retention-days: 30
